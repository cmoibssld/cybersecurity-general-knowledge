<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to my Tor website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(120, 60, 200, .25), transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(40, 120, 220, .2), transparent 45%),
        #03030c;
      font-family: system-ui, sans-serif;
      color: #eef0ff;
    }

    /* Star layers: one tiny dot repeated with box-shadow */
    .stars, .stars::after {
      position: fixed;
      top: 0; left: 0;
      width: 1px; height: 1px;
      border-radius: 50%;
      background: transparent;
      content: "";
    }
    .stars.s1 {
      box-shadow:
        5vw 8vh #fff, 12vw 22vh #fff, 19vw 5vh #cfd8ff, 27vw 35vh #fff, 33vw 12vh #fff,
        41vw 28vh #ffe9c4, 48vw 6vh #fff, 56vw 19vh #fff, 63vw 33vh #cfd8ff, 71vw 9vh #fff,
        79vw 25vh #fff, 86vw 4vh #fff, 93vw 18vh #ffe9c4, 3vw 45vh #fff, 10vw 61vh #fff,
        17vw 74vh #cfd8ff, 24vw 88vh #fff, 31vw 55vh #fff, 38vw 93vh #fff, 45vw 67vh #ffe9c4,
        52vw 82vh #fff, 59vw 49vh #fff, 66vw 71vh #cfd8ff, 73vw 95vh #fff, 80vw 58vh #fff,
        88vw 79vh #fff, 96vw 66vh #fff, 7vw 97vh #fff, 36vw 42vh #fff, 91vw 41vh #cfd8ff;
      animation: twinkle 4s ease-in-out infinite;
    }
    .stars.s2 {
      width: 2px; height: 2px;
      box-shadow:
        8vw 15vh #fff, 22vw 48vh #bcd0ff, 35vw 3vh #fff, 47vw 52vh #fff, 58vw 11vh #ffe0b0,
        69vw 44vh #fff, 83vw 31vh #fff, 95vw 7vh #bcd0ff, 14vw 83vh #fff, 29vw 68vh #fff,
        43vw 86vh #ffe0b0, 61vw 91vh #fff, 77vw 76vh #fff, 90vw 89vh #bcd0ff, 2vw 30vh #fff;
      animation: twinkle 6s ease-in-out infinite 1.5s;
    }
    .stars.s3 {
      width: 3px; height: 3px;
      box-shadow:
        16vw 36vh #fff, 52vw 26vh #fff, 74vw 63vh #fff, 26vw 9vh #fff, 92vw 52vh #fff, 39vw 78vh #fff;
      filter: drop-shadow(0 0 3px #9fb8ff);
      animation: twinkle 3s ease-in-out infinite .7s;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    /* Shooting star */
    .comet {
      position: fixed;
      top: 12vh; left: -20vw;
      width: 140px; height: 2px;
      background: linear-gradient(90deg, transparent, #fff);
      border-radius: 2px;
      transform: rotate(18deg);
      animation: shoot 9s linear infinite 2s;
      opacity: 0;
    }
    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(18deg); opacity: 0; }
      2% { opacity: 1; }
      10% { transform: translate(130vw, 42vw) rotate(18deg); opacity: 0; }
      100% { opacity: 0; }
    }

    /* Planet */
    .planet {
      position: fixed;
      right: -8vmin; bottom: -10vmin;
      width: 55vmin; height: 55vmin;
      border-radius: 50%;
      background:
        repeating-linear-gradient(-20deg,
          rgba(255, 255, 255, .06) 0 6%, transparent 6% 13%, rgba(0, 0, 0, .08) 13% 18%, transparent 18% 25%),
        radial-gradient(circle at 32% 30%, #ffb27a, #d4583c 40%, #6a1f3a 72%, #1c0820 100%);
      box-shadow:
        0 0 80px rgba(255, 120, 80, .25),
        inset -30px -25px 60px rgba(0, 0, 0, .7);
    }
    .ring {
      position: absolute;
      inset: 38% -32%;
      border-radius: 50%;
      border: 6px solid rgba(255, 210, 170, .55);
      box-shadow: 0 0 0 10px rgba(255, 190, 140, .18), 0 0 0 18px rgba(255, 190, 140, .08);
      transform: rotate(-18deg);
      /* hide the back half of the ring behind the planet */
      clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
      animation: sway 20s ease-in-out infinite;
    }
    /* Slow tilt back and forth + gentle breathing of the ring */
    @keyframes sway {
      0%, 100% { transform: rotate(-24deg) scaleY(1); }
      50% { transform: rotate(-10deg) scaleY(.8); }
    }

    /* Small blue planet with the crew slowly orbiting it */
    .small {
      position: fixed;
      top: 24vh; left: 18vw;
      width: 12vmin; height: 12vmin;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #8fe3ff, #2a6fd6 50%, #0b1a4a 100%);
      box-shadow: 0 0 40px rgba(80, 170, 255, .35), inset -8px -8px 18px rgba(0, 0, 0, .6);
    }
    .orbit {
      position: absolute;
      inset: -90%;
      border-radius: 50%;
      border: 1px dashed rgba(160, 200, 255, .12);
      animation: spin 90s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Spaceship + astronaut riding the orbit, drifting gently */
    .crew {
      position: absolute;
      top: 0; left: 50%;
      width: 82px; height: 64px;
      margin: -32px 0 0 -41px;
      display: flex;
      align-items: center;
      gap: 26px;
      animation: drift 12s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -8px); }
    }

    .ship {
      position: relative;
      width: 26px; height: 64px;
      transform: rotate(40deg);
    }
    .ship .body {
      position: absolute; inset: 0;
      border-radius: 50% 50% 40% 40% / 60% 60% 20% 20%;
      background: linear-gradient(90deg, #9aa3c0, #f4f6ff 45%, #b8bfd8);
      z-index: 1;
    }
    .ship .window {
      position: absolute;
      top: 18px; left: 50%;
      width: 12px; height: 12px; margin-left: -6px;
      border-radius: 50%;
      border: 2px solid #6b7391;
      background: radial-gradient(circle at 35% 35%, #bff4ff, #2a6fd6);
      z-index: 2;
    }
    .ship .fin {
      position: absolute;
      bottom: 0;
      width: 11px; height: 20px;
      background: #d4583c;
    }
    .ship .fin.l { left: -8px; border-radius: 100% 0 0 20%; }
    .ship .fin.r { right: -8px; border-radius: 0 100% 20% 0; }
    .ship .flame {
      position: absolute;
      top: 96%; left: 50%;
      width: 12px; height: 22px; margin-left: -6px;
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
      background: radial-gradient(ellipse at 50% 20%, #fff, #ffd36b 35%, #ff6a3a 65%, transparent 72%);
      transform-origin: top;
      animation: flicker .15s infinite alternate;
    }
    @keyframes flicker { to { transform: scaleY(.7); opacity: .8; } }

    .astro {
      position: relative;
      width: 30px; height: 44px;
      animation: tumble 10s ease-in-out infinite;
    }
    @keyframes tumble {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(12deg); }
    }
    .astro div { position: absolute; }
    .astro .arm, .astro .leg { border-radius: 3px; background: #dfe3f2; }
    .astro .arm { top: 20px; width: 6px; height: 13px; }
    .astro .arm.l { left: 1px; transform: rotate(35deg); }
    .astro .arm.r { right: 1px; transform: rotate(-50deg); }
    .astro .leg { top: 31px; width: 7px; height: 13px; }
    .astro .leg.l { left: 7px; transform: rotate(12deg); }
    .astro .leg.r { left: 16px; transform: rotate(-12deg); }
    .astro .torso {
      top: 18px; left: 6px;
      width: 18px; height: 16px;
      border-radius: 6px;
      background: #eef0fa;
    }
    .astro .helmet {
      top: 0; left: 5px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #f4f6ff;
      box-shadow: inset -3px -3px 4px rgba(0, 0, 0, .25), 0 0 8px rgba(180, 200, 255, .4);
    }
    .astro .visor {
      top: 5px; left: 4px;
      width: 12px; height: 8px;
      border-radius: 5px;
      background: linear-gradient(135deg, #2a3a80, #66e4ff);
    }

    /* Soft, glowing welcome line */
    .welcome {
      position: fixed;
      top: 6vh; right: 5vw;
      z-index: 1;
      text-align: right;
      font-size: clamp(.85rem, 2.2vw, 1.35rem);
      font-weight: 200;
      line-height: 2;
      letter-spacing: .4em;
      text-transform: lowercase;
      color: transparent;
      background: linear-gradient(90deg, #8fa8ff, #f3e9ff 50%, #ffc9a8);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 10px rgba(170, 160, 255, .45));
    }
    .welcome::after {
      content: "";
      display: block;
      width: 60px; height: 1px;
      margin: 10px 0 0 auto;
      background: linear-gradient(90deg, transparent, rgba(200, 200, 255, .6));
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stars s1"></div>
  <div class="stars s2"></div>
  <div class="stars s3"></div>
  <div class="comet"></div>

  <div class="planet"><div class="ring"></div></div>

  <div class="small"><div class="orbit"><div class="crew">
    <div class="ship">
      <div class="flame"></div>
      <div class="fin l"></div>
      <div class="fin r"></div>
      <div class="body"></div>
      <div class="window"></div>
    </div>
    <div class="astro">
      <div class="arm l"></div>
      <div class="arm r"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
      <div class="torso"></div>
      <div class="helmet"><div class="visor"></div></div>
    </div>
  </div></div></div>

  <p class="welcome">Welcome to my<br>Tor website</p>
</body>
</html>

[package]
name = "spider"
version = "0.1.0"
edition = "2024"
about = "Download images from a website with an URL"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread"] }
